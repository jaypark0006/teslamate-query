server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: teslamate-query
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teslamate}
    username: ${DB_USER:teslamate}
    password: ${DB_PASS:secret}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      read-only: true
      connection-timeout: 10000
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

teslamate:
  query:
    api-keys: ${API_KEYS:dev-api-key}
    auth-enabled: ${AUTH_ENABLED:true}
    default-page-size: 50
    max-page-size: 500
    cache-ttl-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.teslamate.query: INFO
    org.springframework.jdbc.core: WARN
