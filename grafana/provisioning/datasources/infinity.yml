# Auto-provision Infinity datasource → teslamate-query (Docker network DNS).
apiVersion: 1

datasources:
  - name: TeslaMate Query
    uid: teslamate-query
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      # Base URL used by panels (path only in panel URL field)
      global_queries: []
      auth_method: none
      # Map path queries can exceed the plugin default (60s)
      timeoutInSeconds: 180
      # When AUTH_ENABLED=true, set auth_method: headerKey and secureJsonData below
      # authHeader: X-API-Key
    # secureJsonData:
    #   authHeaderValue: your-api-key
    # Custom health: Grafana may not probe Infinity the same way as Prometheus.
    # In panels use full URL: http://teslamate-query:8080/api/v1/...
